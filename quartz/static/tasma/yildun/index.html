  "İlk fotoğraf öğleden sonra geldi.",
  "Deniz sakindi. Gökyüzüyle arasında ince, neredeyse cetvelle çizilmiş bir çizgi vardı. Fotoğrafı çeken adamın nerede durduğu belli değildi. Görüntünün içinde yalnızca su ve gökyüzü bulunuyordu.",
  "Fotoğraf kaydedildi.",
  "İkincisi üç gün sonra geldi. Bu kez deniz daha koyuydu. Üçüncü fotoğrafta ufuk görünmüyordu. Dördüncüsü gece çekilmişti, karanlığın içindeki suyu seçmek güçtü.",
  "Bir süre sonra fotoğrafları gönderen deniz işçisine nerede olduğu sorulmamaya başlandı. Yalnızca fotoğraf isteniyordu. Utanılası. Bir keresinde de ona denizin hiç sıkılıp sıkılmadığını soracaktım. Sonra vazgeçtim. Çünkü denizden sıkılan bir adamın bana fotoğraf göndermeye devam etmesi pek hoş olmazdı. Fotoğrafları saklıyorum hâlâ. Hepsini. Karanlık olanları da. Birbirinin aynısı görünenleri de. Bazen içlerinden birini silmeye niyetleniyorum. Tam o sırada ötekilerin ona alışmış olabileceği geliyor aklıma. Bir fotoğrafın içinde ufuk çizgisi gördüğümde, orada bir şeylerin devam ettiğine inanıyorum. Fotoğrafın bittiği yerden sonra başka sular, başka gemiler, başka sabahlar var. Bunu bilmek hoşuma gidiyor. ",
  "Denizler telefonumda birikmeye başladı. Denizlerin bir kısmını yastığımın altında saklamak isterdim oysa. Bir kısmını iç cebimde, birazını da kitaplığımdaki saygın yazarların arasında. Telefonun içinde durduklarında fazla uslu görünüyorlar. Birbirlerine karışmadan, taşmadan, hiçbir şeyi ıslatmadan bekliyorlar. Oysa deniz dediğin biraz terbiyesiz olmalı. Hiç değilse geceleri evin içinde dolaşmalı, kapıların altından sızmalı, sabah kalktığında çoraplarını ıslak bulmalısın.",
  "Burada göller var. Gayet terbiyeli göller. Kıyıları belli, adları belli, hangi vapurun kaçta kalkacağı belli. Suyun nereye kadar gideceğini herkes biliyor. Bir gölün başına gidip saatlerce bekleseniz kimse size dünyanın öbür tarafına geçebileceğinizi söylemez. Denizde öyle değil. Deniz insanı kandırmaya daha elverişli.",
  "Geçen gün fotoğraflardan birini büyüttüm. O kadar büyüttüm ki deniz kayboldu. Ekranda yalnızca birbirine benzemeyen küçük renk parçaları kaldı. İnsan bazı şeylere fazla yakından bakınca onları kaybediyor. Bunu söylemek istemezdim. Çünkü ben yakından bakmayı seven biriyim. Ulaşamadığım bir şeyi görüntüler aracılığıyla kendime yaklaştırırken aslında aradaki mesafeyi daha görünür hâle getiriyordum. Muazzam bir buluş, kendi adıma. Elimi uzatabileceğim bir yüzey bulduğum için bu çelişki bir süreliğine kabul edilebilir. ",
  "Dünya, eksik bir şeyi hatırlatmak için hiçbir çaba göstermediği hâlde, insan dünyanın kendisine karşı örgütlendiğini düşünmeye başlıyor. Böyle olunca sıradan bir bilgi kişisel bir felakete dönüşebiliyor haliyle. Eksik olan daha küçük, gündelik ve inatçı parçalara ayrılıyor. Bir kelime eskisi gibi kullanılamıyor. Bazı şarkılar dinlenilmiyor. Bazı şeylere bakarken artık yalnızca baktığı şeyi görmüyor. İstediğim şeye ulaşamadığımda ona benzeyen şeyleri toplamaya başladığımı fark ettim. Bunun bir hesap olduğunu sanmıyorum. Yüz denizin bir deniz edeceğini düşündüğümden değil. Ama insanın aklıyla bildiği şeylerin davranışları üzerinde sanıldığı kadar büyük bir yetkisi yok.",

  "Ne kadar anlaşılmaz.",

  "Çünkü insan kendi acısının dünyadaki her şeyi açıklamasına izin verdiğinde, başka insanların hayatlarını da kendi hikâyesinin malzemesine dönüştürebiliyor. Oysa o fotoğraflarda benim bilmediğim saatler, yorgunluklar, yolculuklar var şüphesiz. Birinin çalışarak geçirdiği zaman, benim bekleyerek geçirdiğim zamanla aynı görüntüde karşılaşıyordu. Aynı deniz, iki ayrı hayatın içinde birbirinden tamamen farklı anlamlar taşıyabiliyordu.",

  "Biriktirmek, zamana karşı geliştirdiğim en eski ve en başarısız savunmalardan biri. İnsan bir şeyi yeterince saklarsa onun kaybolmayacağını düşünüyor. Oysa saklanan şey çoğaldıkça, saklanamayan şeyin yokluğu daha belirgin hâle gelebiliyor.",
  "Bir sürü fotoğrafım vardı. Her birinde deniz gerçekten vardı. Hiçbiri bir öncekinin aynısı değildi. Işık değişiyor, hava değişiyor, suyun rengi değişiyordu. Dünya, hiçbir şey olmamış gibi hareket etmeye devam ediyordu. Bense bu hareketin içinden değişmeyen bir şey çıkarmaya çalışıyordum. Belki tekrarın anlamı buydu. Aynı görüntüyü aramak değil, her yeni görüntüde eski bir eksikliği sınamak. Bu kez başka olabilir mi? Bu kez bir şey yerinden oynar mı? İnsan bunu kendisine açıkça sormuyor. Yalnızca bir fotoğrafı daha açıyor.",
  "Sonra bir başkasını.",
  "Bir başkasını.",
  "Bir süre sonra kaybın kendisiyle, kaybın etrafında kurduğum hayatı birbirinden ayırmakta zorlanıyorum. Başlangıçta hatırlamak için yapılan şeyler, zamanla hatırlama istediğin şeyden bağımsız bir düzene dönüşüyor. Yokluk artık yalnızca katlanılan bir durum değil, üzerinde çalıştığım bir malzeme oluyor. İnsan, kendisini yaralayan şeyin çevresinde yeni bir düzen kurarken bunun bir iyileşme mi yoksa yaranın daha dayanıklı bir biçimde korunması mı olduğunu anlayamıyor. Bunun iyileşmek mi yoksa kaybı başka araçlarla sürdürmek mi olduğunu bilmiyorum. Belki ikisi arasında kesin bir ayrım da yok.  ",
  "İnsan bazen kurtulmak istediği şeyin içinden geçerek kendisine bir hayat kuruyor. Başlangıçta bir başkasına ait olan kelimeler, yavaş yavaş kendi dilinin parçası hâline geliyor. Birinin yokluğundan doğan şeyler, o insan hiç geri dönmese de yaşamaya devam edebiliyor. Belki de insan, kendisine verilmeyen tek bir cevabın çevresinde, ömrünün geri kalanında başka cevaplar biriktirebiliyor.",
  "Ama cevaplar biriktikçe soru küçülmüyor. Her fotoğraf, denizi ekranın içine biraz daha dolduruyor. Aynı anda, o denize ulaşamayan yokluğun sınırlarını da çiziyor. Ufuk genişlemiyor artık, yalnızca eksikliğin biçimi keskinleşiyor.",
  "Sonunda elimde yüzlerce deniz ve hiçbirine açılmayan tek bir cevap kalıyor. O cevap, bir cümle gibi değil, kıyıya vuran ve geri çekilen su gibi duruyor önümde. Ne kadar yaklaşırsa yaklaşsın, bana ait olmayan bir yere dönüyor.",
  "Telefonun ışığı söndüğünde deniz de kaybolmuyor. Karanlıkta, bütün görüntülerin altından yükseliyor. Akşam yeni bir fotoğraf geldi. Bu kez deniz neredeyse görünmüyordu. Her yer sisti. Suyun nerede başladığı, gökyüzünün nerede bittiği belli değildi. Uzun süre baktım. İlk defa bir fotoğrafı büyütmedim. Belki de içlerinde en çok buna yer vardı. Onu da sakladım."
];

function frame(now){const dt=document.hidden?0:Math.min(C.FRAME_DT_CAP_SECONDS,(now-last)/1000);last=now;clock+=dt;if(phase==='reading'){readProgress();if(!reduced)level=Math.min(target,level+C.READING_SPEED_PER_SECOND*dt);}else if(phase==='fill'){const p=Math.min(1,(clock-phaseAt)/C.FILL_SECONDS);level=Math.max(level,fillFrom+(1-fillFrom)*p*p);if(p>=1){level=1;phase='hold';phaseAt=clock;}}else if(phase==='hold'&&clock-phaseAt>=C.WATER_HOLD_SECONDS){phase='archive';phaseAt=clock;showArchive();}else if(phase==='archive'){const p=Math.min(1,(clock-phaseAt)/C.ARCHIVE_REVEAL_SECONDS);setArchiveOpacity(p);if(p>=1)finishArchive();}renderer.draw();requestAnimationFrame(frame);}
addEventListener('resize',()=>{renderer.resize();layout();});requestAnimationFrame(frame);
