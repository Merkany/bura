<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>[ insan mısın? ] — Bura</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10111f;color:#efe7d8;font:16px/1.5 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px 16px}main{width:min(100%,420px)}.back{color:#cfc6b4;text-decoration:none;font-size:14px}.label{font:14px monospace;margin:28px 0 14px;color:#a89f8f}.panel{background:#faf9f5;color:#242629;padding:8px;border:1px solid #d8cfbd;box-shadow:0 8px 32px #0003}.heading{background:#345e81;color:white;padding:20px 18px;margin-bottom:8px}h1{font-size:21px;line-height:1.3;margin:0 0 8px}.heading p{font-size:16px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tile{position:relative;aspect-ratio:1;border:0;padding:0;background:#ddd;cursor:pointer;overflow:hidden}.photo{display:block;width:100%;height:100%;background-image:url('./emek.png');background-size:300% 300%;background-position:var(--pos)}.tile[aria-pressed=true] .photo{transform:scale(.85)}.tile[aria-pressed=true]{background:#345e81}.tile[aria-pressed=true]:after{content:'✓';position:absolute;top:3px;left:4px;color:white;background:#345e81;border-radius:50%;width:24px;height:24px;font-weight:700}.tile:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #b56828;outline-offset:3px;z-index:1}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 4px 6px}.status{font-size:14px;margin:0;min-height:24px;color:#a12c26}button.verify{border:0;background:#345e81;color:white;padding:12px 20px;font:600 14px system-ui;cursor:pointer}.success{padding:44px 18px;text-align:center}.success p{color:#28633c;font-size:20px}.success a{display:inline-block;color:#242629;margin:12px}.success button{display:block;margin:16px auto 0;background:none;border:0;text-decoration:underline;color:#666;cursor:pointer;font:14px system-ui}[hidden]{display:none!important}@media(prefers-reduced-motion:no-preference){.photo{transition:transform .12s}}

.bura-weather { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.3rem 1.5rem; padding: 0.65rem 1rem; border-bottom: 1px solid var(--lightgray, #303044); background: var(--light, #10111f); color: var(--darkgray, #cfc6b4); font: 13px/1.5 var(--bodyFont, system-ui); text-align: center; }
.bura-weather-label { font: 10px/1.5 var(--codeFont, monospace); letter-spacing: 0.1em; }

body { display:flex; flex-direction:column; padding:0; } .bura-weather { width:100%; flex-shrink:0; } main { margin:24px auto; width:min(calc(100% - 32px),420px); }

/* Belirgin, ortalanmış hava durumu bannerı. */
.bura-weather {
  width: 100%;
  min-height: 68px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0.35rem 1rem;
  flex-wrap: wrap;
  padding: 18px 24px;
  background: #d8cfbd;
  color: #202235;
  border-bottom: 2px solid #a9694f;
  text-align: center;
  font: 500 16px/1.6 system-ui, sans-serif;
}
.bura-weather-label {
  font: 700 16px/1.6 system-ui, sans-serif;
  letter-spacing: 0;
}
@media (max-width: 520px) {
  .bura-weather { flex-direction: column; gap: 2px; padding: 13px 16px; }
}

body { align-items:center; justify-content:flex-start; }

/* Yavaş kayan hava raporu; başlık sabit kalır. */
.bura-weather {
  box-sizing: border-box;
  min-height: 0;
  height: 42px;
  padding: 0 24px;
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 20px;
  font-size: 14px;
  overflow: hidden;
}
.bura-weather-label { flex: 0 0 auto; font-size: 13px; }
.weather-window { display: block; overflow: hidden; width: min(650px, 55vw); min-width: 0; text-align: left; }
.weather-track { display: block; white-space: nowrap; width: max-content; padding-left: 650px; animation: weather-drift 14s linear infinite; }
.bura-weather:hover .weather-track, .bura-weather:focus-within .weather-track { animation-play-state: paused; }
.weather-window:focus-visible { outline: 2px solid #345e81; outline-offset: 2px; }
@keyframes weather-drift { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@media (max-width: 520px) {
  .bura-weather { height: 42px; padding: 0 12px; gap: 12px; flex-direction: row; }
  .bura-weather-label { font-size: 11px; }
  .weather-window { flex: 1; }
  .weather-track { padding-left: 220px; animation-duration: 11s; }
}
@media (prefers-reduced-motion: reduce) {
  .bura-weather { height: auto; min-height: 42px; padding-top: 8px; padding-bottom: 8px; }
  .weather-track { animation: none; padding-left: 0; white-space: normal; width: auto; }
}


/* Hava şeridi renkleri. */
.bura-weather { background: #191b32; color: #efe7d8; border-bottom: 1px solid #30334b; }
.bura-weather-label { color: #c08f78; }
</style>
</head>
<body><aside class="bura-weather" aria-label="Bura — kurmaca hava raporu"><span class="bura-weather-label">Bura'nın hava durumu:</span><span class="weather-window" tabindex="0" aria-label="Bugün hava sınıf çatışmalı."><span class="weather-track" aria-hidden="true">Bugün hava sınıf çatışmalı.</span></span></aside><main><a class="back" href="../../">← Bura</a><p class="label">[ insan mısın? ]</p><section class="panel" aria-label="İnsan olduğunu doğrula">
<div id="challenge"><div class="heading"><h1>İnsan olduğunu doğrula.</h1><p>Emek içeren bütün kareleri seç.</p></div><div class="grid" role="group" aria-label="Görseller"></div><div class="footer"><p class="status" role="status" aria-live="polite"></p><button class="verify" type="button">Doğrula</button></div></div>
<div class="success" hidden tabindex="-1"><p>✓ Devam edebilirsin.</p><a href="../../">Bura’ya dön</a><button type="button" id="reset">Yeniden dene</button></div>
</section></main>
<script>
const labels=['Market rafları','Kasada çalışan bir kişi','Kolilerle dolu depo','Park edilmiş kamyon','Tarlada çalışan bir kişi','Fabrikada çalışan bir kişi','Paketleme bandı','Temizlenmiş market zemini','Barkodlu kapalı koli'];
const grid=document.querySelector('.grid'),status=document.querySelector('.status'),challenge=document.querySelector('#challenge'),success=document.querySelector('.success');
labels.forEach((label,i)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label',label);b.setAttribute('aria-pressed','false');b.style.setProperty('--pos',`${i%3*50}% ${Math.floor(i/3)*50}%`);const p=document.createElement('span');p.className='photo';p.setAttribute('aria-hidden','true');b.append(p);b.addEventListener('click',()=>{b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));status.textContent=''});grid.append(b)});
document.querySelector('.verify').addEventListener('click',()=>{const missing=9-grid.querySelectorAll('[aria-pressed=true]').length;if(missing){status.textContent=`${missing} kareyi atladın.`;return}challenge.hidden=true;success.hidden=false;success.focus()});
document.querySelector('#reset').addEventListener('click',()=>{grid.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));status.textContent='';success.hidden=true;challenge.hidden=false;grid.querySelector('button').focus()});
</script></body></html>
