<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>[ insan mısın? ] — Bura</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10111f;color:#efe7d8;font:16px/1.5 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px 16px}main{width:min(100%,420px)}.back{color:#cfc6b4;text-decoration:none;font-size:14px}.label{font:14px monospace;margin:28px 0 14px;color:#a89f8f}.panel{background:#faf9f5;color:#242629;padding:8px;border:1px solid #d8cfbd;box-shadow:0 8px 32px #0003}.heading{background:#345e81;color:white;padding:20px 18px;margin-bottom:8px}h1{font-size:21px;line-height:1.3;margin:0 0 8px}.heading p{font-size:16px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tile{position:relative;aspect-ratio:1;border:0;padding:0;background:#ddd;cursor:pointer;overflow:hidden}.photo{display:block;width:100%;height:100%;background-image:url('./emek.png');background-size:300% 300%;background-position:var(--pos)}.tile[aria-pressed=true] .photo{transform:scale(.85)}.tile[aria-pressed=true]{background:#345e81}.tile[aria-pressed=true]:after{content:'✓';position:absolute;top:3px;left:4px;color:white;background:#345e81;border-radius:50%;width:24px;height:24px;font-weight:700}.tile:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #b56828;outline-offset:3px;z-index:1}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 4px 6px}.status{font-size:14px;margin:0;min-height:24px;color:#a12c26}button.verify{border:0;background:#345e81;color:white;padding:12px 20px;font:600 14px system-ui;cursor:pointer}.success{padding:44px 18px;text-align:center}.success p{color:#28633c;font-size:20px}.success a{display:inline-block;color:#242629;margin:12px}.success button{display:block;margin:16px auto 0;background:none;border:0;text-decoration:underline;color:#666;cursor:pointer;font:14px system-ui}[hidden]{display:none!important}@media(prefers-reduced-motion:no-preference){.photo{transition:transform .12s}}
body.embedded{background:transparent}
body.embedded .back{display:none}
</style>
</head>
<body><a class="back" href="../../">← Bura</a><p class="label">[ insan mısın? ]</p><main><section class="panel" aria-label="İnsan olduğunu doğrula">
<div id="challenge"><div class="heading"><h1>İnsan olduğunu doğrula.</h1><p>Emek içeren bütün kareleri seç.</p></div><div class="grid" role="group" aria-label="Görseller"></div><div class="footer"><p class="status" role="status" aria-live="polite"></p><button class="verify" type="button">Doğrula</button></div></div>
<div class="success" hidden tabindex="-1"><p id="success-text"></p><a href="../../">Bura'ya dön</a><button type="button" id="reset">Yeniden dene</button></div>
</section></main>
<script>
const items=[
  {label:'Market rafları', idx:0},
  {label:'Kasada çalışan bir kişi', idx:1},
  {label:'Paketlenmiş market ürünleri', idx:2},
  {label:'Park edilmiş kamyon', idx:3},
  {label:'Tarlada çalışan bir kişi', idx:4},
  {label:'Üretim bandındaki paketler', idx:5},
  {label:'Boşaltılmayı bekleyen kasalar', idx:6},
  {label:'Temizlenmiş market zemini', idx:7},
  {label:'Barkodlu kapalı koli', idx:8},
];
const TOTAL=items.length;
const grid=document.querySelector('.grid'),status=document.querySelector('.status'),challenge=document.querySelector('#challenge'),success=document.querySelector('.success'),successText=document.querySelector('#success-text');
const params=new URLSearchParams(location.search);
const embedded = params.get('embed')==='1' || window.top!==window.self;
if(embedded){document.body.classList.add('embedded')}

const wrongMessages=[
  null, // index 0 unused
  missing=>`${missing} kareyi atladın.`,
  ()=>'Yine atladın. Alışkanlık mı?',
  ()=>'Emeği görmek bu kadar zor olamaz.',
  ()=>'Bu kadar emek göz önünde ve yine de kaçırıyorsun.',
];
const wrongFinal=()=>'Devam etmek için hepsini görmen gerekiyor.';
const successMessages={
  1: ()=>'Hepsini gördün. Bu iyiye mi işaret, kötüye mi?',
  2: ()=>'İkinci seferde gördün. Umut var.',
  3: ()=>'Üç sefer baktın, sonunda gördün. Görmemek daha kolaydı.',
};
const successFinal=()=>'Sonunda gördün.';

let attempts=0;

items.forEach((item)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label',item.label);b.setAttribute('aria-pressed','false');b.style.setProperty('--pos',`${item.idx%3*50}% ${Math.floor(item.idx/3)*50}%`);const p=document.createElement('span');p.className='photo';p.setAttribute('aria-hidden','true');b.append(p);b.addEventListener('click',()=>{b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));status.textContent=''});grid.append(b)});

document.querySelector('.verify').addEventListener('click',()=>{
  attempts++;
  const missing=TOTAL-grid.querySelectorAll('[aria-pressed=true]').length;
  if(missing){
    status.textContent = attempts<=wrongMessages.length-1 ? wrongMessages[attempts](missing) : wrongFinal();
    return;
  }
  challenge.hidden=true;
  successText.textContent = successMessages[attempts] ? successMessages[attempts]() : successFinal();
  success.hidden=false;
  success.focus();
  if(embedded && window.parent){
    window.parent.postMessage('insan-misin-verified','*');
  }
});

if(embedded){
  // Embedded haldeyken "Bura'ya dön" linki sayfayı kendi içinde
  // (iframe'in dar kutusunda) açmasın; üst pencereye kapat mesajı
  // gönderip beklemeden hemen kapatsın.
  document.querySelector('.success a').addEventListener('click', (e) => {
    e.preventDefault();
    if (window.parent) window.parent.postMessage('insan-misin-close', '*');
  });
}

document.querySelector('#reset').addEventListener('click',()=>{grid.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));status.textContent='';success.hidden=true;challenge.hidden=false;grid.querySelector('button').focus()});
</script></body></html>
